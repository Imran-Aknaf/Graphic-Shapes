<!DOCTYPE html>
<html>

<head>
  <title>Shapes Demo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="shape-ui">
    <button class="ui-button" id="vertex-button">Vertices</button>
    <button class="ui-button" id="edge-button">Edges</button>
    <button class="ui-button" id="face-button">Faces</button>
    <button class="ui-button" id="culling-button">Backface Culling</button>
    <button class="ui-button" id="color-button">Colors</button>
    <button class="ui-button" id="normal-button">Normals</button>
  </div>
  <div id="camera-ui">
    <button class="ui-button" id="reset-button">Camera Reset</button>
  </div>
  <div id="light-ui">
    <div class="light-column">
      <!-- Ambient light -->
      <div class="light-control">

        <button class="ui-button" id="ambient-button">
          Ambient
        </button>

        <input id="ambient-slider" type="range" min="0" max="1" step="0.01" value="0.5">

      </div>

      <!-- Directional light -->
      <div class="light-control">

        <button class="ui-button" id="directional-button">
          Directional
        </button>

        <label>
          Strength
        </label>

        <input id="directional-strength-slider" type="range" min="0" max="2" step="0.01" value="1">


        <label>
          Elevation
        </label>

        <input id="directional-elevation-slider" type="range" min="-90" max="90" step="45" value="45">


        <label>
          Rotation
        </label>

        <input id="directional-rotation-slider" type="range" min="0" max="360" step="45" value="0">

      </div>
    </div>
    <div class="light-column">
      <!-- Point light -->
      <div class="light-control">

        <button class="ui-button" id="point-button">Point</button>

        <label>Strength</label>
        <input id="point-strength-slider" type="range" min="0" max="2" step="0.01" value="1">

        <label>Position X</label>
        <input id="point-x-slider" type="range" min="-5" max="5" step="0.1" value="2">

        <label>Position Y</label>
        <input id="point-y-slider" type="range" min="-5" max="5" step="0.1" value="2">

        <label>Position Z</label>
        <input id="point-z-slider" type="range" min="-5" max="5" step="0.1" value="2">

        <!-- Attenuation -->
        <button class="ui-button" id="attenuation-button">Attenuation</button>

        <div class="attenuation-controls">

          <label>Constant</label>
          <input id="attenuation-constant-slider" type="range" min="0" max="2" step="0.01" value="1">

          <label>Linear</label>
          <input id="attenuation-linear-slider" type="range" min="0" max="1" step="0.01" value="0.1">

          <label>Quadratic</label>
          <input id="attenuation-quadratic-slider" type="range" min="0" max="0.1" step="0.001" value="0.01">

        </div>
      </div>
    </div>
  </div>

  <button id="back-button">Back</button>

  <div id="menu"></div>
  <canvas id="canvas"></canvas> <!--Just a container for to display our graphic logic-->

  <script type="module" src="index.js"></script>
</body>

</html>
